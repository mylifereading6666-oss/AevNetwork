name: Deploy AevNetwork API

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/aevnetwork-api/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-aevnetwork-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy aevnetwork-api --project-ref "$SUPABASE_PROJECT_ID"
