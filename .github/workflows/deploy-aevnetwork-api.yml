name: Deploy AevNetwork API

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/aevnetwork-api/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-aevnetwork-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aevnetwork-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Secret SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::GitHub Secret SUPABASE_PROJECT_ID is missing."
            exit 1
          fi
          supabase functions deploy aevnetwork-api --remote "$SUPABASE_PROJECT_ID" --yes
